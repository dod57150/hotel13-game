<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Hotel 13 — Web3 Game</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0d0a1a;
      --card-bg: rgba(255, 255, 255, 0.05);
      --border-color: rgba(235, 179, 54, 0.3);
      --accent-color: #EBB336;
      --success-color: #4DE7A8;
      --danger-color: #FF5555;
      --text-color: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      max-width: 400px;
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 24px;
      color: var(--accent-color);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .status-bar {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      background: var(--card-bg);
      padding: 10px 15px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      font-size: 14px;
    }

    .game-container {
      width: 100%;
      max-width: 400px;
      background: var(--card-bg);
      border-radius: 20px;
      border: 1px solid var(--border-color);
      padding: 20px;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    .floor-title {
      font-size: 20px;
      margin-bottom: 15px;
    }

    .doors-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .door-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px 10px;
      font-size: 24px;
      color: var(--text-color);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .door-btn:active {
      transform: scale(0.95);
      background: rgba(235, 179, 54, 0.2);
    }

    .action-btn {
      width: 100%;
      background: linear-gradient(135deg, #EBB336 0%, #D49211 100%);
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.2s;
    }

    .action-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .share-btn {
      background: linear-gradient(135deg, #4DE7A8 0%, #2BB87E 100%);
      color: #000;
      display: none;
    }

    .footer-note {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Hotel 13</h1>
    <div class="status-bar">
      <span>Поверх: <strong id="current-floor">1</strong> / 13</span>
      <span>Баланс: <strong id="user-balance">$100</strong> $ROOM</span>
    </div>
  </header>

  <main class="game-container">
    <div class="floor-title" id="floor-heading">Кімната 1</div>
    
    <div class="doors-grid" id="doors-container">
      <button class="door-btn" onclick="openDoor(1)">🚪 1</button>
      <button class="door-btn" onclick="openDoor(2)">🚪 2</button>
      <button class="door-btn" onclick="openDoor(3)">🚪 3</button>
    </div>

    <!-- Кнопка надсилання результату в чат -->
    <button id="share-card-btn" class="action-btn share-btn" onclick="shareVictoryCard()">
      📸 Похизуватися результатом
    </button>
    <div id="share-note" class="footer-note" style="display: none;">
      * Витрати приховано. Картку буде надіслано в чат з ботом
    </div>
  </main>

  <script>
    // Ініціалізація Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Стан гри
    let currentFloor = 1;
    let balance = 100;
    let lastWinAmount = 0;

    // Вкажіть URL вашого серверного бекенду
    const BACKEND_URL = "https://your-server.com/api/send-card";

    // Обробка вибору дверей
    function openDoor(doorIndex) {
      if (tg?.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('medium');
      }

      // Імітація логіки виграшу (наприклад, перехід на наступний поверх)
      const isWin = Math.random() > 0.3; // 70% шанс виграшу для тесту

      if (isWin) {
        lastWinAmount = currentFloor * 100;
        balance += lastWinAmount;
        currentFloor++;

        document.getElementById('current-floor').innerText = currentFloor;
        document.getElementById('user-balance').innerText = `$${balance}`;
        document.getElementById('floor-heading').innerText = `Кімната ${currentFloor}`;

        if (tg?.HapticFeedback) {
          tg.HapticFeedback.notificationOccurred('success');
        }

        // Показуємо кнопку шерингу після успішного поверху
        showShareOption(true);
      } else {
        if (tg?.HapticFeedback) {
          tg.HapticFeedback.notificationOccurred('error');
        }
        alert("Пастка! Ви втратили спробу.");
      }
    }

    function showShareOption(visible) {
      const shareBtn = document.getElementById('share-card-btn');
      const shareNote = document.getElementById('share-note');
      if (visible) {
        shareBtn.style.display = 'block';
        shareNote.style.display = 'block';
      } else {
        shareBtn.style.display = 'none';
        shareNote.style.display = 'none';
      }
    }

    // --- ГЕНЕРАЦІЯ ТА ВІДПРАВКА СКАРТКИ ПЕРЕМОГИ ---

    async function shareVictoryCard() {
      const playerName = tg?.initDataUnsafe?.user?.first_name || "Гравець";
      const userId = tg?.initDataUnsafe?.user?.id;
      const initData = tg?.initData;

      // 1. Створюємо прихований Canvas
      const canvas = document.createElement('canvas');
      canvas.width = 1200;
      canvas.height = 630;
      const ctx = canvas.getContext('2d');

      // Градієнтний фон
      const bgGradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      bgGradient.addColorStop(0, '#0F0C20');
      bgGradient.addColorStop(0.5, '#15102A');
      bgGradient.addColorStop(1, '#06040A');
      ctx.fillStyle = bgGradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Сяйво в центрі
      const glow = ctx.createRadialGradient(600, 315, 50, 600, 315, 450);
      glow.addColorStop(0, 'rgba(235, 179, 54, 0.18)');
      glow.addColorStop(1, 'transparent');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Glassmorphic плашка
      ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
      ctx.strokeStyle = 'rgba(235, 179, 54, 0.4)';
      ctx.lineWidth = 3;
      drawRoundedRect(ctx, 100, 80, 1000, 470, 24);
      ctx.fill();
      ctx.stroke();

      // Тексти на картці
      ctx.fillStyle = '#EBB336';
      ctx.font = 'bold 36px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('HOTEL 13 • VICTORY CARD', 600, 150);

      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 52px sans-serif';
      ctx.fillText(`${playerName} пройшов Кімнату ${currentFloor - 1}!`, 600, 240);

      ctx.fillStyle = '#4DE7A8';
      ctx.font = 'extrabold 80px sans-serif';
      ctx.fillText(`+$${lastWinAmount} $ROOM`, 600, 360);

      ctx.fillStyle = '#A0A0B0';
      ctx.font = '28px sans-serif';
      ctx.fillText('Заходь у Hotel 13 та випробуй свою удачу!', 600, 450);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
      ctx.font = 'italic 20px sans-serif';
      ctx.fillText('Витрати приховано • Виграш збережено на баланс', 600, 500);

      // 2. Конвертація в Blob та відправка
      canvas.toBlob(async (blob) => {
        if (!userId) {
          // Якщо гра запуск у звичайному браузері
          const shareUrl = `https://t.me/Hotel13GameBot?startapp=ref_guest`;
          const shareText = `🔥 Я щойно здолав Кімнату ${currentFloor - 1} у Hotel 13!`;
          window.open(`https://t.me/share/url?url=${encodeURIComponent(shareUrl)}&text=${encodeURIComponent(shareText)}`, '_blank');
          return;
        }

        const formData = new FormData();
        formData.append("photo", blob, "victory-card.png");
        formData.append("user_id", userId);
        formData.append("init_data", initData);

        try {
          tg?.MainButton?.setText("НАДСИЛАННЯ...").show();

          const response = await fetch(BACKEND_URL, {
            method: "POST",
            body: formData,
          });

          const result = await response.json();

          if (result.ok) {
            tg?.HapticFeedback?.notificationOccurred('success');
            tg?.showAlert("🏆 Картку перемоги надіслано у ваш чат з ботом!");
          } else {
            throw new Error(result.error || "Server error");
          }
        } catch (err) {
          console.error(err);
          // Фолбек: звичайне посилання
          const shareUrl = `https://t.me/Hotel13GameBot?startapp=ref_${userId}`;
          const shareText = `🔥 Я щойно здолав Кімнату ${currentFloor - 1} у Hotel 13! Спробуєш обігнати?`;
          tg?.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(shareUrl)}&text=${encodeURIComponent(shareText)}`);
        } finally {
          tg?.MainButton?.hide();
        }
      }, "image/png");
    }

    function drawRoundedRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }
  </script>
</body>
</html>
