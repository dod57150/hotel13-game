<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hotel 13 - Web3 Game V12</title>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- html2canvas для генерації зображення-картки -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.min.js"></script>

    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151a23;
            --accent-color: #00f2fe;
            --accent-gold: #ffb703;
            --danger-color: #ff4757;
            --text-color: #ffffff;
            --text-dim: #8a99ad;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            transition: background 0.4s ease;
        }

        header {
            background: rgba(21, 26, 35, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .user-info { display: flex; flex-direction: column; gap: 4px; }
        .user-name { font-weight: 700; font-size: 15px; }
        .user-spent { font-size: 12px; color: var(--text-dim); }
        .wallet-box { display: flex; align-items: center; gap: 8px; }

        .balance {
            background: rgba(0, 242, 254, 0.1);
            color: var(--accent-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid rgba(0, 242, 254, 0.3);
        }

        .btn-topup-fast {
            background: #2ed573;
            color: #000;
            border: none;
            padding: 8px 12px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }

        .room-header {
            text-align: center;
            margin: 8px 0 4px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
        }

        .sponsor-badge {
            font-size: 11px;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .room-title { font-size: 20px; font-weight: 800; color: var(--accent-gold); }
        .room-subtitle { font-size: 12px; color: var(--danger-color); font-weight: 600; margin-top: 2px; }

        .prize-banner {
            background: linear-gradient(135deg, rgba(255, 183, 3, 0.2), rgba(255, 119, 0, 0.2));
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 8px;
            border-radius: 10px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            margin-top: 6px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 183, 3, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 183, 3, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 183, 3, 0); }
        }

        .doors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 10px;
            margin: 10px 0;
            max-height: 42vh;
            overflow-y: auto;
            padding: 4px;
        }

        .door-card {
            background: rgba(21, 26, 35, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            height: 90px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .door-card.wrong {
            background: rgba(255, 255, 255, 0.05) !important;
            border-color: var(--text-dim) !important;
            opacity: 0.4;
            cursor: not-allowed;
        }

        .door-card.trap {
            background: rgba(255, 71, 87, 0.4) !important;
            border-color: var(--danger-color) !important;
            cursor: not-allowed;
        }

        .door-icon { font-size: 26px; margin-bottom: 2px; }
        .door-number { font-size: 11px; color: #fff; font-weight: 700; background: rgba(0,0,0,0.6); padding: 2px 6px; border-radius: 8px; }

        .actions-panel {
            background: rgba(21, 26, 35, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .price-info { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-dim); }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.1s active;
        }

        .btn:active { transform: scale(0.98); }

        .btn-insurance-buy {
            background: rgba(255, 183, 3, 0.15);
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
        }

        .btn-insurance-buy:disabled { opacity: 0.4; border-color: var(--text-dim); color: var(--text-dim); }

        .btn-insurance-buy.owned {
            background: rgba(46, 213, 115, 0.15);
            color: #2ed573;
            border: 1px solid #2ed573;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 100;
        }

        .modal-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            border: 1px solid var(--accent-gold);
        }

        .modal-title { font-size: 22px; color: var(--accent-gold); margin-bottom: 8px; }
        .modal-desc { font-size: 14px; color: var(--text-dim); margin-bottom: 20px; }
        .modal-btns { display: flex; flex-direction: column; gap: 10px; }
        .btn-take { background: #2ed573; color: #000; }
        .btn-share { background: linear-gradient(135deg, #0088cc, #00c6ff); color: #fff; font-size: 15px; }
        .btn-risk { background: transparent; color: #fff; border: 1px solid rgba(255, 255, 255, 0.3); }

        /* Шаблон Картки Успіху (для рендерингу зображення/повідомлення) */
        .result-card-preview {
            background: linear-gradient(135deg, #1e1b4b, #311042);
            border: 2px solid var(--accent-gold);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(255, 183, 3, 0.2);
            position: relative;
            overflow: hidden;
        }

        .result-card-preview::before {
            content: "HOTEL 13";
            position: absolute;
            right: -10px;
            bottom: -10px;
            font-size: 40px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.04);
            letter-spacing: 2px;
        }

        .card-trophy { font-size: 42px; margin-bottom: 4px; }
        .card-amount { font-size: 32px; font-weight: 900; color: var(--accent-gold); text-shadow: 0 0 10px rgba(255, 183, 3, 0.5); }
        .card-player { font-size: 13px; color: var(--accent-color); font-weight: 700; margin-top: 4px; }
        .card-room-info { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

        @keyframes shake {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-10px, 0); }
            40% { transform: translate(10px, 0); }
            60% { transform: translate(-8px, 0); }
            80% { transform: translate(8px, 0); }
            100% { transform: translate(0, 0); }
        }

        .shake-effect { animation: shake 0.4s ease-in-out; }
    </style>
</head>
<body>

    <header>
        <div class="user-info">
            <span class="user-name" id="username">Гравець</span>
            <span class="user-spent">Витрачено: <b id="total-spent" style="color:#ff4757;">0 $ROOM</b></span>
        </div>
        <div class="wallet-box">
            <div class="balance" id="user-balance">100 $ROOM</div>
            <button class="btn-topup-fast" id="fast-topup-btn" onclick="quickAddFunds()">+<span id="fast-amount">100</span></button>
        </div>
    </header>

    <div class="room-header">
        <div class="sponsor-badge" id="sponsor-name">Спонсор: General Hotel</div>
        <div class="room-title" id="room-name">КІМНАТА 1</div>
        <div class="room-subtitle" id="room-doors-count">Склад кімнати</div>
        <div class="prize-banner" id="prize-next-banner" style="display: none;"></div>
    </div>

    <div class="doors-grid" id="doors-container"></div>

    <div class="actions-panel">
        <div class="price-info">
            <span>Ціна ключа: <strong id="key-price" style="color:#00f2fe;">БЕЗКОШТОВНО</strong></span>
            <span>Страховка: <strong id="insurance-price" style="color:#ffb703;">$4.99</strong></span>
        </div>
        
        <button class="btn btn-insurance-buy" id="buy-insurance-btn" onclick="handleInsuranceClick()">
            🛡️ Купити страховку ($4.99)
        </button>
    </div>

    <!-- Модалка вибору: ризикнути чи забрати -->
    <div class="modal-overlay" id="prize-modal">
        <div class="modal-card">
            <div class="modal-title" id="modal-title-text">ВІТАЄМО! 🎉</div>
            <div class="modal-desc" id="modal-desc-text">Ви пройшли контрольний рівень!</div>
            <div class="modal-btns">
                <button class="btn btn-take" onclick="takePrize()">💰 Забрати приз і вийти</button>
                <button class="btn btn-risk" id="btn-continue-game" onclick="continueGame()">🚀 Ризикнути й грати далі</button>
            </div>
        </div>
    </div>

    <!-- Модалка виграшу з візуальною Карткою Результату -->
    <div class="modal-overlay" id="success-claim-modal">
        <div class="modal-card">
            <div class="modal-title">ПРИЗ ЗАРАХОВАНО! 🤑</div>
            
            <!-- Візуальна картка для похвасту -->
            <div class="result-card-preview" id="shareable-result-card">
                <div class="card-trophy">🏆</div>
                <div class="card-amount" id="card-prize-val">$100</div>
                <div class="card-player" id="card-player-name">Гравець</div>
                <div class="card-room-info" id="card-room-info">Пройдено Кімнату 6 у Hotel 13</div>
            </div>

            <div class="modal-btns">
                <button class="btn btn-share" id="share-btn" onclick="shareSuccessWin()">🚀 Розповісти про успіх</button>
                <button class="btn btn-take" onclick="closeSuccessModalAndReset()">Грати знову 🔄</button>
            </div>
        </div>
    </div>

    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
        let playerName = "Гравець";

        if (tg) {
            tg.ready();
            tg.expand();
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                playerName = tg.initDataUnsafe.user.first_name || "Гравець";
                document.getElementById('username').innerText = playerName;
            }
        }

        const roomThemes = {
            1: { sponsor: "Crypto Exchange X", bg: "linear-gradient(135deg, #0f2027, #203a43, #2c5364)", doorBg: "#151a23", doorIcon: "🚪" },
            2: { sponsor: "Binance Partner", bg: "linear-gradient(135deg, #1e130c, #4a2f00)", doorBg: "#2a1e0a", doorIcon: "🚪" },
            3: { sponsor: "RedBull Energy", bg: "linear-gradient(135deg, #200112, #4da0b0)", doorBg: "#182026", doorIcon: "⚡" },
            default: { sponsor: "VIP Casino Club", bg: "linear-gradient(135deg, #0b0e14, #1a2332)", doorBg: "#151a23", doorIcon: "🚪" }
        };

        const roomBaseKeyPrices = {
            1: 1, 2: 1, 3: 1, 4: 1, 5: 1,
            6: 5, 7: 5,
            8: 25, 9: 25,
            10: 100, 11: 100,
            12: 500, 13: 500
        };

        const roomPrizes = {
            6: "$100", 8: "$1,000", 10: "$10,000", 12: "$100,000", 13: "$1,000,000"
        };

        let currentRoom = 1;
        let doorsCount = 2;
        let keyPrice = 0;
        let userBalance = 100;
        let totalSpent = 0;
        let roomKeysSpent = 0;
        let defaultTopUpAmount = 100;
        let lastClaimedPrize = "$0";
        let lastPassedRoom = 1;

        let accumulatedTraps = 0;
        let activeTrapsCount = 1;
        let currentInsuranceCost = 4.99;
        let hasInsurance = false;
        let winningDoor = 1;
        let trapDoors = [];
        let wrongAttemptsInRoom = 0;

        function calculateKeyPrice() {
            if (wrongAttemptsInRoom === 0) return 0;
            const base = roomBaseKeyPrices[currentRoom] || 1;
            return base * Math.pow(2, wrongAttemptsInRoom - 1);
        }

        function calculateInsuranceCost() {
            const baseKey = roomBaseKeyPrices[currentRoom] || 1;
            return (baseKey * 5) * Math.pow(1.8, wrongAttemptsInRoom);
        }

        function renderRoom() {
            doorsCount = currentRoom * 2;
            const theme = roomThemes[currentRoom] || roomThemes.default;

            document.body.style.background = theme.bg;
            document.getElementById('sponsor-name').innerText = `Спонсор: ${theme.sponsor}`;
            document.getElementById('room-name').innerText = `КІМНАТА ${currentRoom}`;
            
            const emptyDoorsCount = Math.max(0, doorsCount - 1 - activeTrapsCount);
            document.getElementById('room-doors-count').innerText = 
                `Склад: 1 Виграш | ${activeTrapsCount} ☠️ Пасток | ${emptyDoorsCount} Порожніх`;

            const banner = document.getElementById('prize-next-banner');
            if (roomPrizes[currentRoom]) {
                banner.style.display = 'block';
                banner.innerText = `🎁 Наступним вдалим кроком ви здобудете: ${roomPrizes[currentRoom]}!`;
            } else {
                banner.style.display = 'none';
            }

            updateActionPanel();
            updateWalletUI();

            const container = document.getElementById('doors-container');
            container.innerHTML = '';

            for (let i = 1; i <= doorsCount; i++) {
                const door = document.createElement('div');
                door.className = 'door-card';
                door.id = `door-${i}`;
                door.style.backgroundColor = theme.doorBg;

                door.innerHTML = `
                    <div class="door-icon" id="icon-${i}">${theme.doorIcon}</div>
                    <div class="door-number">№ ${i}</div>
                `;
                door.onclick = () => selectDoor(i);
                container.appendChild(door);
            }
        }

        function updateActionPanel() {
            keyPrice = calculateKeyPrice();
            
            const keyPriceText = keyPrice === 0 ? "БЕЗКОШТОВНО" : `${keyPrice} $ROOM`;
            document.getElementById('key-price').innerText = keyPriceText;

            currentInsuranceCost = calculateInsuranceCost();
            document.getElementById('insurance-price').innerText = `$${currentInsuranceCost.toFixed(2)}`;

            const buyBtn = document.getElementById('buy-insurance-btn');

            if (currentRoom === 13) {
                buyBtn.innerText = "❌ Страховка заборонена в 13 кімнаті";
                buyBtn.disabled = true;
                buyBtn.classList.remove('owned');
            } else if (hasInsurance) {
                buyBtn.innerText = "🛡️ Активувати страховку (повернути 50%)";
                buyBtn.disabled = false;
                buyBtn.classList.add('owned');
            } else {
                buyBtn.innerText = `🛡️ Купити страховку ($${currentInsuranceCost.toFixed(2)})`;
                buyBtn.disabled = false;
                buyBtn.classList.remove('owned');
            }
        }

        function updateWalletUI() {
            document.getElementById('user-balance').innerText = `${userBalance.toFixed(2)} $ROOM`;
            document.getElementById('total-spent').innerText = `${totalSpent.toFixed(2)} $ROOM`;
            document.getElementById('fast-amount').innerText = defaultTopUpAmount;
        }

        function selectDoor(selected) {
            const doorElem = document.getElementById(`door-${selected}`);
            if (doorElem.classList.contains('wrong') || doorElem.classList.contains('trap')) return;

            if (userBalance < keyPrice) {
                alert(`Недостатньо $ROOM! Для відкриття потрібен ключ за ${keyPrice} $ROOM.`);
                return;
            }

            userBalance -= keyPrice;
            totalSpent += keyPrice;
            roomKeysSpent += keyPrice;
            updateWalletUI();

            if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

            if (selected === winningDoor) {
                if (window.confetti) confetti({ particleCount: 60, spread: 60, origin: { y: 0.7 } });
                if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

                lastPassedRoom = currentRoom;

                if (currentRoom === 13) {
                    showFinalVictoryModal();
                } else if ([6, 8, 10, 12].includes(currentRoom)) {
                    showPrizeModal();
                } else {
                    currentRoom++;
                    resetRoomState(true);
                    renderRoom();
                }
            } 
            else if (trapDoors.includes(selected)) {
                doorElem.classList.add('trap');
                document.getElementById(`icon-${selected}`).innerText = '☠️';

                document.body.classList.add('shake-effect');
                setTimeout(() => document.body.classList.remove('shake-effect'), 400);
                if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');

                if (hasInsurance) {
                    useInsurance('trap');
                } else {
                    alert(`💥 ПАСТКА!\n\n💀 GAME OVER! Вас відкинуто в Кімнату ${Math.max(1, currentRoom - 1)}.`);
                    currentRoom = Math.max(1, currentRoom - 1);
                    resetRoomState(false);
                    renderRoom();
                }
            } 
            else {
                doorElem.classList.add('wrong');
                document.getElementById(`icon-${selected}`).innerText = '⬛';

                wrongAttemptsInRoom++;
                updateActionPanel();
            }
        }

        function handleInsuranceClick() {
            if (currentRoom === 13) return;

            if (hasInsurance) {
                useInsurance('manual');
                return;
            }

            if (userBalance < currentInsuranceCost) {
                alert(`Недостатньо $ROOM для купівлі страховки за $${currentInsuranceCost.toFixed(2)}!`);
                return;
            }

            userBalance -= currentInsuranceCost;
            totalSpent += currentInsuranceCost;
            hasInsurance = true;
            updateWalletUI();

            if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            alert(`🛡️ Страховку успішно придбано!`);
            updateActionPanel();
        }

        function useInsurance(reason) {
            const refund = roomKeysSpent * 0.5;
            userBalance += refund;
            totalSpent -= refund;
            hasInsurance = false;

            if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

            if (reason === 'trap') {
                alert(`💥 ПАСТКА!\n\n🛡️ Страховка спрацювала! Повернуто 50% витрат (${refund.toFixed(2)} $ROOM).`);
            } else {
                alert(`🛡️ Страховку активовано! Повернуто 50% витрат (${refund.toFixed(2)} $ROOM).`);
            }

            resetRoomState(false);
            renderRoom();
        }

        function resetRoomState(passedRoom = true) {
            wrongAttemptsInRoom = 0;
            roomKeysSpent = 0;

            if (passedRoom) {
                hasInsurance = false;
                accumulatedTraps += 1;
            }

            doorsCount = currentRoom * 2;
            const trapLimitPercentage = currentRoom <= 10 ? 0.20 : 0.30;
            const maxAllowedTraps = Math.max(1, Math.floor(doorsCount * trapLimitPercentage));

            activeTrapsCount = Math.min(accumulatedTraps, maxAllowedTraps);

            winningDoor = Math.floor(Math.random() * doorsCount) + 1;
            trapDoors = [];

            while (trapDoors.length < activeTrapsCount) {
                let randTrap = Math.floor(Math.random() * doorsCount) + 1;
                if (randTrap !== winningDoor && !trapDoors.includes(randTrap)) {
                    trapDoors.push(randTrap);
                }
            }
        }

        function quickAddFunds() {
            userBalance += defaultTopUpAmount;
            updateWalletUI();
            if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        }

        function showPrizeModal() {
            document.getElementById('modal-title-text').innerText = "ВІТАЄМО! 🎉";
            document.getElementById('modal-desc-text').innerHTML = `Ви пройшли контрольний рівень ${currentRoom}! Ваш приз: <b style="color:#ffb703;">${roomPrizes[currentRoom]}</b>.`;
            document.getElementById('btn-continue-game').style.display = 'block';
            document.getElementById('prize-modal').style.display = 'flex';
        }

        function showFinalVictoryModal() {
            document.getElementById('modal-title-text').innerText = "🏆 ВЕЛИКА ПЕРЕМОГА! 🏆";
            document.getElementById('modal-desc-text').innerHTML = `Ви пройшли всі 13 кімнат! Ваш джекпот: <b style="color:#ffb703; font-size:20px;">$1,000,000</b>!`;
            document.getElementById('btn-continue-game').style.display = 'none';
            document.getElementById('prize-modal').style.display = 'flex';
        }

        function takePrize() {
            lastClaimedPrize = roomPrizes[currentRoom] || "$0";
            const prizeAmount = parseInt(lastClaimedPrize.replace(/\D/g, ''), 10);

            if (prizeAmount > 0) {
                userBalance += prizeAmount;
                updateWalletUI();
            }

            document.getElementById('prize-modal').style.display = 'none';

            // Оновлюємо вміст візуальної картки
            document.getElementById('card-prize-val').innerText = lastClaimedPrize;
            document.getElementById('card-player-name').innerText = playerName;
            document.getElementById('card-room-info').innerText = `Успішно пройдено Кімнату ${lastPassedRoom} у Hotel 13`;

            // Відкриваємо модалку виводу з карткою результату
            document.getElementById('success-claim-modal').style.display = 'flex';
        }

        async function shareSuccessWin() {
            const btn = document.getElementById('share-btn');
            btn.innerText = "⏳ Формуємо картку...";
            btn.disabled = true;

            const cardElement = document.getElementById('shareable-result-card');
            const shareText = `🔥 Гравець ${playerName} щойно виграв і забрав ${lastClaimedPrize} у гри Hotel 13 (Кімната ${lastPassedRoom})! Спробуй перевершити цей результат! 🚀`;

            try {
                // Створення зображення картки з DOM через html2canvas
                const canvas = await html2canvas(cardElement, { scale: 2, backgroundColor: null });
                
                canvas.toBlob(async (blob) => {
                    const file = new File([blob], `hotel13_win_${lastClaimedPrize}.png`, { type: 'image/png' });

                    // 1. Спроба використати нативний мобільний Web Share з файлом зображення
                    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                        try {
                            await navigator.share({
                                title: 'Hotel 13 Win',
                                text: shareText,
                                files: [file]
                            });
                            btn.innerText = "🚀 Розповісти про успіх";
                            btn.disabled = false;
                            return;
                        } catch (e) {
                            console.log("Share call failed/cancelled", e);
                        }
                    }

                    // 2. Якщо в Telegram WebApp — пересилання через Telegram
                    if (tg && tg.openTelegramLink) {
                        const tgShareUrl = `https://t.me/share/url?url=${encodeURIComponent(window.location.href)}&text=${encodeURIComponent(shareText)}`;
                        tg.openTelegramLink(tgShareUrl);
                    } else {
                        // 3. Фолбек: Завантаження зображення картки + Копіювання тексту
                        const link = document.createElement('a');
                        link.download = `Hotel13_Win_${lastClaimedPrize}.png`;
                        link.href = canvas.toDataURL();
                        link.click();

                        if (navigator.clipboard) {
                            await navigator.clipboard.writeText(shareText);
                        }
                        alert("📸 Картку результату завантажено, а текст скопійовано в буфер обміну! Поділіться ним у будь-якому чаті.");
                    }

                    btn.innerText = "🚀 Розповісти про успіх";
                    btn.disabled = false;
                }, 'image/png');

            } catch (err) {
                console.error(err);
                alert("Не вдалося згенерувати картку. Відкриваємо текстове повідомлення.");
                if (tg && tg.openTelegramLink) {
                    tg.openTelegramLink(`https://t.me/share/url?text=${encodeURIComponent(shareText)}`);
                }
                btn.innerText = "🚀 Розповісти про успіх";
                btn.disabled = false;
            }
        }

        function closeSuccessModalAndReset() {
            document.getElementById('success-claim-modal').style.display = 'none';
            currentRoom = 1;
            accumulatedTraps = 0;
            resetRoomState(true);
            renderRoom();
        }
        
        function continueGame() {
            document.getElementById('prize-modal').style.display = 'none';
            currentRoom++;
            resetRoomState(true);
            renderRoom();
        }

        resetRoomState(false);
        renderRoom();
    </script>
</body>
</html>
