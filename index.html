<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hotel 13</title>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #121212);
            color: var(--tg-theme-text-color, #ffffff);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            min-height: 100vh;
        }

        .header {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .balance-box {
            font-size: 18px;
            font-weight: bold;
            color: #4cd964;
        }

        .info-btn {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
        }

        .game-grid {
            width: 100%;
            max-width: 400px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 15px;
        }

        .door-btn {
            height: 100px;
            background: #222;
            border: 2px solid #444;
            border-radius: 10px;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .door-btn:active {
            transform: scale(0.96);
        }

        .controls {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }

        .insurance-btn {
            background: #ff9500;
            color: #fff;
        }

        .insurance-btn:disabled {
            background: #444;
            color: #777;
            cursor: not-allowed;
        }

        .insurance-btn.active {
            background: #34c759;
            box-shadow: 0 0 10px rgba(52, 199, 89, 0.6);
        }

        @keyframes shake {
            0% { transform: translate(0, 0); background-color: rgba(255, 0, 0, 0.3); }
            25% { transform: translate(-8px, 4px); }
            50% { transform: translate(8px, -4px); }
            75% { transform: translate(-5px, 2px); }
            100% { transform: translate(0, 0); background-color: transparent; }
        }

        .shake-effect {
            animation: shake 0.4s ease-in-out;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-body {
            background: #222;
            padding: 20px;
            border-radius: 12px;
            max-width: 320px;
            color: #fff;
        }

        .modal-body h3 { margin-bottom: 10px; color: #ff9500; }
        .modal-body p { font-size: 14px; line-height: 1.4; margin-bottom: 10px; }
        .close-modal { background: #007aff; color: #fff; width: 100%; padding: 8px; border: none; border-radius: 6px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="balance-box">Баланс: <span id="balance">500</span> ₴</div>
        <button class="info-btn" onclick="toggleModal(true)">ℹ️</button>
    </div>

    <div class="game-grid">
        <button class="door-btn" onclick="selectDoor(1)">🚪 1</button>
        <button class="door-btn" onclick="selectDoor(2)">🚪 2</button>
        <button class="door-btn" onclick="selectDoor(3)">🚪 3</button>
        <button class="door-btn" onclick="selectDoor(4)">🚪 4</button>
    </div>

    <div class="controls">
        <button id="insurance-btn" class="action-btn insurance-btn" onclick="handleInsuranceClick()">
            Придбати страховку (50 ₴)
        </button>
    </div>

    <div class="modal" id="info-modal">
        <div class="modal-body">
            <h3>🎮 Правила гри Hotel 13</h3>
            <p><b>Обирайте двері:</b> За трьома дверима схований виграш, за однією — пастка.</p>
            <p><b>Страховка:</b> Купуйте страховку та натискайте кнопкою вручну, щоб захистити баланс від наступного вибуху.</p>
            <p><b>Зарахування:</b> Усі виграші автоматично додаються до вашого рахунку.</p>
            <button class="close-modal" onclick="toggleModal(false)">Зрозуміло</button>
        </div>
    </div>

    <script>
        // 1. Ініціалізація Telegram WebApp
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Стан гри
        let balance = 500;
        let hasInsurance = false;       // Придбано
        let insuranceActive = false;   // Активовано вручну

        const balanceEl = document.getElementById('balance');
        const insuranceBtn = document.getElementById('insurance-btn');

        function updateUI() {
            balanceEl.innerText = balance;

            if (insuranceActive) {
                insuranceBtn.disabled = true;
                insuranceBtn.className = "action-btn insurance-btn active";
                insuranceBtn.innerText = "Захист активовано 🛡️";
            } else if (hasInsurance) {
                insuranceBtn.disabled = false;
                insuranceBtn.className = "action-btn insurance-btn";
                insuranceBtn.innerText = "Активувати страховку 🛡️";
            } else {
                insuranceBtn.disabled = balance < 50;
                insuranceBtn.className = "action-btn insurance-btn";
                insuranceBtn.innerText = "Придбати страховку (50 ₴)";
            }
        }

        // 2. Ручне управління страховкою
        function handleInsuranceClick() {
            if (!hasInsurance && balance >= 50) {
                balance -= 50;
                hasInsurance = true;
                updateUI();
            } else if (hasInsurance && !insuranceActive) {
                insuranceActive = true;
                hasInsurance = false;
                if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                updateUI();
            }
        }

        // 3. Звуковий синтезатор
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'win') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'trap') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // 4. Логіка вибору дверей та подій
        function selectDoor(doorNum) {
            const isTrap = Math.random() < 0.3; // 30% пастка

            if (isTrap) {
                if (insuranceActive) {
                    insuranceActive = false;
                    alert("🛡️ Страховка врятувала вас від пастки!");
                    updateUI();
                    return;
                }

                // Ефект вибуху
                document.body.classList.add('shake-effect');
                setTimeout(() => document.body.classList.remove('shake-effect'), 400);
                playSound('trap');
                if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');

                balance = Math.max(0, balance - 100);
            } else {
                // Ефект виграшу
                confetti({ particleCount: 50, spread: 50, origin: { y: 0.7 } });
                playSound('win');
                if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

                const winAmount = Math.floor(Math.random() * 80) + 30;
                balance += winAmount;
            }

            updateUI();
        }

        function toggleModal(show) {
            document.getElementById('info-modal').style.display = show ? 'flex' : 'none';
        }

        updateUI();
    </script>
</body>
</html>
